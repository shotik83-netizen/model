name: Validate financial model

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify standalone HTML build
        run: python3 scripts/build_standalone.py --check
      - name: Test data adapter and calculation core
        run: node tests/test_core.js
      - name: Reconcile economy and cash-flow formulas
        run: node tests/test_economy.js
      - name: Verify bank and primary document links
        run: node tests/test_bank_links.js
      - name: Test source Excel audit without private workbook
        run: python3 tests/test_excel_audit.py
      - name: Guard preliminary Excel/app comparison
        run: python3 tests/test_excel_compare.py
      - name: Validate data contract, workbooks and factor bridge
        run: python3 scripts/validate_model.py
      - name: Verify published pilot and factor example
        run: |
          python3 tests/test_pilot_readiness.py
          python3 tests/test_factor_example.py
